version: "3"
services:
  mssql-2025:
    build:
      context: docker/
      dockerfile: docker-mssql-2025.dockerfile
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "<YourStrong@Passw0rd>"
    ports:
      - "${TIBERIUS_TEST_PORT:-1433}:1433"

  mssql-2022:
    build:
      context: docker/
      dockerfile: docker-mssql-2022.dockerfile
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "<YourStrong@Passw0rd>"
    ports:
      - "${TIBERIUS_TEST_PORT:-1433}:1433"

  mssql-2019:
