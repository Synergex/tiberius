      context: docker/
      dockerfile: docker-mssql-2017.dockerfile
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "<YourStrong@Passw0rd>"
    ports:
      - "${TIBERIUS_TEST_PORT:-1433}:1433"

  mssql-azure-sql-edge:
    build:
      context: docker/
      dockerfile: docker-azure-sql-edge.dockerfile
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "<YourStrong@Passw0rd>"
    ports:
      - "${TIBERIUS_TEST_PORT:-1433}:1433"
